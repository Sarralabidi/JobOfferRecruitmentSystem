<!-- Error Message -->
<div *ngIf="errorMessage" class="alert alert-danger text-center">
    <strong>Error!</strong> {{ errorMessage }}
  </div>
  
  <!-- No Job Offers Message -->
  <div *ngIf="!errorMessage && jobOffers.length === 0" class="alert alert-info text-center">
    <strong>Notice!</strong> No job offers available at the moment.
  </div>
  
  <!-- Job Offers List -->
  <div *ngIf="!errorMessage && jobOffers.length > 0">
    <ul class="list-group">
      <li *ngFor="let jobOffer of jobOffers" class="list-group-item d-flex justify-content-between align-items-center">
        <div class="job-info">
          <h5 class="mb-1 job-title">{{ jobOffer.title }}</h5>
          <p class="mb-1 company-name"><strong>{{ jobOffer.company }}</strong></p>
          <p class="text-muted mb-1 location">{{ jobOffer.location }}</p>
          <p class="description mb-1">{{ jobOffer.description | slice:0:150 }}...</p>
        </div>
        <button class="btn btn-orange btn-sm" [routerLink]="['/applyjob', jobOffer.id,jobOffer.title]">Apply Now</button>

      </li>
    </ul>
  </div>
