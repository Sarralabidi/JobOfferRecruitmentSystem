<div class="container">
  <h2>Event Category Management</h2>

  <!-- Ajouter une catégorie -->
  <input type="text" class="form-control mb-2" [(ngModel)]="newCategory.name" placeholder="Category Name">
  <button class="btn btn-primary" (click)="addCategory()">Add Category</button>

  <hr>

  <!-- Liste des catégories -->
  <ul class="list-group">
    <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let category of categories">
      {{ category.name }}
      <span>
        <button class="btn btn-warning btn-sm me-2" (click)="editCategory(category)">Edit</button>
        <button class="btn btn-danger btn-sm" (click)="deleteCategory(category.id!)">Delete</button>
      </span>
    </li>
  </ul>

  <!-- Formulaire d'édition -->
  <div *ngIf="selectedCategory" class="mt-3">
    <h4>Edit Category</h4>
    <input type="text" class="form-control mb-2" [(ngModel)]="selectedCategory.name">
    <button class="btn btn-success me-2" (click)="updateCategory()">Update</button>
    <button class="btn btn-secondary" (click)="cancelEdit()">Cancel</button>
  </div>
</div>
